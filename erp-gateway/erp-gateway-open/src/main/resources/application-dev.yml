spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        # 开放接口：认证（API Key 模式）
        - id: erp-auth-open
          uri: http://erp-auth:8080
          predicates:
            - Path=/open/auth/**
          filters:
            - StripPrefix=1

        # 开放接口：基础数据查询
        - id: erp-base-open
          uri: http://erp-base:8080
          predicates:
            - Path=/open/base/**
          filters:
            - StripPrefix=1

        # 开放接口：库存查询
        - id: erp-inventory-open
          uri: http://erp-inventory:8080
          predicates:
            - Path=/open/inventory/**
          filters:
            - StripPrefix=1

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: false
            maxAge: 3600

gateway:
  auth:
    whitelist:
      - /open/auth/**
      - /actuator/**
