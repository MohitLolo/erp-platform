server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: erp-finance
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/erp_finance?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Erp@123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:Erp@redis2024}
      timeout: 3000ms

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USERNAME:erp}
    password: ${RABBITMQ_PASSWORD:Erp@rabbit2024}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1

sa-token:
  token-name: Authorization
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET:dev-jwt-secret-key-erp-platform-2024}
  is-share: false
  token-style: terse-uuid

seata:
  enabled: true
  application-id: erp-finance
  tx-service-group: erp-finance-group
  service:
    vgroup-mapping:
      erp-finance-group: default
  config:
    type: file
  registry:
    type: file

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.erp.finance.domain.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

feign:
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 5000
  circuitbreaker:
    enabled: true

logging:
  level:
    com.erp.finance: debug
