---
# 默认拒绝 erp-prod 命名空间业务服务 Pod 的所有入站流量
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: erp-services-default-deny-ingress
  namespace: erp-prod
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - erp-auth
          - erp-system
          - erp-base
          - erp-purchase
          - erp-sale
          - erp-inventory
          - erp-finance
          - erp-production
          - erp-report
  policyTypes:
    - Ingress

---
# 仅允许 gateway 访问业务服务 8080 端口
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: erp-services-allow-ingress-from-gateway
  namespace: erp-prod
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - erp-auth
          - erp-system
          - erp-base
          - erp-purchase
          - erp-sale
          - erp-inventory
          - erp-finance
          - erp-production
          - erp-report
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: erp-gateway
      ports:
        - protocol: TCP
          port: 8080
